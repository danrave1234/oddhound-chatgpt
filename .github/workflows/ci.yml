name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: node:26-bookworm-slim@sha256:28147155d47dc31abe0a46e0d12b59b2fb3d0a2dcc5dc65fce76a074180b16fe
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: oddhound
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: oddhound_test
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://oddhound:ci-disposable-only@postgres:5432/oddhound_test
      ODDHOUND_APP_URL: https://example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm check:policy
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit:deps
  browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker compose run --rm setup
      - run: docker compose run --rm setup pnpm exec tsx apps/fixture/bootstrap.ts
      - run: docker build --file apps/browser/Dockerfile --tag oddhound-product-browser:development .
      - name: Create owned HTTPS fixture certificate
        run: |
          mkdir -p data/lab-tls
          docker run --rm --network none --mount "type=bind,source=$PWD/data/lab-tls,target=/out" --entrypoint openssl oddhound-product-browser:development req -x509 -newkey rsa:2048 -nodes -days 2 -keyout /out/key.pem -out /out/cert.pem -subj /CN=OddhoundOwnedLab -addext 'basicConstraints=critical,CA:TRUE' -addext 'subjectAltName=DNS:fixture-lab,DNS:fixture-corrected-lab'
      - run: docker compose run --rm setup pnpm exec tsx apps/browser/lab-prepare.ts
      - run: docker compose -f compose.yaml -f compose.browser-lab.yaml up -d dns-lab fixture-lab fixture-corrected-lab browser-lab
      - run: docker compose -f compose.yaml -f compose.browser-lab.yaml run --rm browser-lab-controller
      - name: Show bounded component evidence
        if: always()
        run: |
          test ! -f docs/evidence/browser-tools-lab.json || cat docs/evidence/browser-tools-lab.json
          docker compose -f compose.yaml -f compose.browser-lab.yaml logs --tail 20 browser-lab
      - name: Stop this job's containers
        if: always()
        run: docker compose -f compose.yaml -f compose.browser-lab.yaml down
